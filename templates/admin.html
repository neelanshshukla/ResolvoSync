<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResolvoSync - Admin Dashboard</title>
    <link rel="stylesheet" href="/static/css/admin.css">
    <link href="/static/css/font-awesome.min.css" rel="stylesheet">
</head>
<body>
    <div id="admin-page" class="page active">
        <header class="dashboard-header">
            <div class="user-info">
                <h2>Hi, Admin</h2>
            </div>
            <div class="system-status">
                <button class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>

        <main class="dashboard-content">
            <div class="panel full-width">
                <h3><i class="fas fa-clipboard-list"></i> All Registered Complaints</h3>
                <div class="table-container">
                    <table id="admin-complaints-table">
                        <thead>
                            <tr>
                                <th>Block-Room No</th>
                                <th>Student Name</th>
                                <th>Topic</th>
                                <th>Timing</th>
                                <th>Status Action</th>
                            </tr>
                        </thead>
                        <tbody id="admin-table-body">
                            <!-- JavaScript will populate this table body -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/admin.js"></script>
</body>
</html>
